<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Meu perfil | VidaPlus Hospital</title>
    <link href="../css/style.css" rel="stylesheet">
    <script defer src="../js/main.js"></script>
    <script defer src="../js/usuarios.js"></script>
    <script defer src="../js/paciente.js"></script>
  </head>
  <body data-perfil="Paciente">
    <a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
    <div class="sistema">
      <nav aria-label="Menu principal" class="menu">
        <div class="menu-logo">
          <img alt="Logo VidaPlus Hospital" src="../imagens/logo-vidaplus.png">
          <div>
            <strong>VidaPlus Hospital</strong>
            <small>Paciente</small>
          </div>
        </div>
        <a href="paciente-dashboard.html">Início</a>
        <a class="ativo" href="paciente-perfil.html">Meu perfil</a>
        <a href="paciente-historico.html">Histórico clínico</a>
        <a href="paciente-agendar.html">Agendar consulta</a>
        <a href="paciente-consultas.html">Minhas consultas</a>
        <a href="paciente-teleconsulta.html">Teleconsulta</a>
        <a href="paciente-notificacoes.html">Notificações</a>
        <a href="#" onclick="sairDoSistema(); return false;">Sair</a>
      </nav>
      <main class="conteudo" id="conteudo-principal">
        <div class="topo">
          <div>
            <h2>Meu perfil</h2>
          </div>
          <div class="usuario-topo">
            <small>Usuário logado</small>
            <br>
            <strong class="nome-usuario-logado">Usuário</strong>
            <br>
            <small class="detalhe-usuario-logado">
            </small>
          </div>
        </div>
        <div class="card">
          <div class="form-grid">
            <div class="grupo">
              <label for="nome">Nome completo</label>
              <input class="campo" id="nome">
            </div>
            <div class="grupo">
              <label for="cpf">CPF</label>
              <input autocomplete="off" class="campo" id="cpf" inputmode="numeric" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" type="text">
            </div>
            <div class="grupo">
              <label for="nascimento">Data de nascimento</label>
              <input autocomplete="bday" class="campo" id="nascimento" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" type="text">
            </div>
            <div class="grupo">
              <label for="telefone">Telefone</label>
              <input autocomplete="tel" class="campo" id="telefone" inputmode="numeric" maxlength="15" placeholder="(47) 99999-9999" type="tel">
            </div>
            <div class="grupo">
              <label for="emailPaciente">E-mail</label>
              <input autocomplete="email" class="campo" id="emailPaciente" type="email">
            </div>
            <div class="grupo">
              <label for="convenio">Convênio</label>
              <input class="campo" id="convenio">
            </div>
            <div class="grupo coluna-inteira">
              <label for="endereco">Endereço</label>
              <input class="campo" id="endereco">
            </div>
          </div>
          <div class="acoes">
            <button class="botao botao-azul" onclick="salvarPerfilPaciente()">Salvar alterações</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
